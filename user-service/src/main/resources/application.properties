spring.application.name=user-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=${SERVER_PORT:7701}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# Sampling at 10% by default: full sampling at millions of requests costs more to store
# than it is worth. Errors are always sampled.
management.tracing.sampling.probability=${TRACE_SAMPLE_RATE:0.1}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

app.keycloak.url=${KEYCLOAK_URL}
app.keycloak.realm=${KEYCLOAK_REALM}
app.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
app.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- throughput ---
# Virtual threads are on, so a blocking Keycloak Admin call parks a carrier-free virtual
# thread instead of pinning a platform thread. Tomcat's thread pool ceiling is irrelevant
# under virtual threads; connection-pool size is the real concurrency limit.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=10000
# Required by hibernate.connection.provider_disables_autocommit below: that setting tells
# Hibernate to trust the pool has already turned autoCommit off and skip its own
# setAutoCommit(false) call. Hikari's own default is autoCommit=true, so without this the
# two settings contradict each other and every commit fails with "Cannot commit when
# autoCommit is enabled".
spring.datasource.hikari.auto-commit=false

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

server.compression.enabled=true
server.compression.mime-types=application/json
