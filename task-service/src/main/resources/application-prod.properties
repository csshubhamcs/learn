logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.learn.taskservice=INFO

spring.jpa.properties.hibernate.format_sql=false

# server.tomcat.threads.max is deliberately NOT set: with spring.threads.virtual.enabled=true
# Tomcat uses a virtual-thread executor and the pool ceiling no longer applies. The real
# concurrency limit is the Hikari pool size.

management.endpoint.health.show-details=never
